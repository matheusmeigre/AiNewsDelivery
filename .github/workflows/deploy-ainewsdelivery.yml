name: Deploy AI News Delivery (Azure Functions)

on:
  push:
    branches:
      - main
    paths:
      - 'src/Platform.AiNewsDelivery/**'
      - 'src/Platform.Contracts/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'ainews-delivery-prod' # Atualize com o nome real do seu App Service no Azure ou Railway
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore src/Platform.AiNewsDelivery/Platform.AiNewsDelivery.csproj

    - name: Build
      run: dotnet build src/Platform.AiNewsDelivery/Platform.AiNewsDelivery.csproj --configuration Release --no-restore

    # Execução dos Testes Unitários
    - name: Run Tests
      run: dotnet test src/Platform.AiNewsDelivery.Tests/Platform.AiNewsDelivery.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish
      run: dotnet publish src/Platform.AiNewsDelivery/Platform.AiNewsDelivery.csproj -c Release -o ./publish /p:UseAppHost=false

    # Exemplo de Deploy para Azure Functions. Descomente e configure as Secrets no GitHub.
